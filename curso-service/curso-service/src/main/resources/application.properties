spring.application.name=curso-service
server.port=8082

spring.datasource.url=jdbc:h2:file:./data/cursodb;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

jwt.secret=ClaveSecretaSuperSeguraParaEscuelaMicroserviciosPDTprofeAPROBAME

management.endpoints.web.exposure.include=health,info