spring.application.name=admin-service
server.port=8083

spring.datasource.url=jdbc:h2:file:./data/admindb;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

jwt.secret=ClaveSecretaSuperSeguraParaEscuelaMicroserviciosPDTprofeAPROBAME
spring.jackson.deserialization.FAIL_ON_NULL_FOR_PRIMITIVES=false

management.endpoints.web.exposure.include=health,info
management.info.env.enabled=true